# Configuration Plymouth de référence pour ExoLyx.
# Plymouth ne lit pas de dossier plymouthd.conf.d : le réglage effectif est
# écrit dans /etc/plymouth/plymouthd.conf par `plymouth-set-default-theme exolyx`
# (fait par exolyx-plymouth.install, sans reconstruire l'initramfs).
[Daemon]
Theme=exolyx
ShowDelay=0
DeviceTimeout=8
