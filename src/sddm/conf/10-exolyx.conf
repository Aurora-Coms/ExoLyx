# Configuration SDDM d'ExoLyx (paquet exolyx-sddm)
[Theme]
Current=exolyx
CursorTheme=ExoLyx-Curseur

[General]
# Échelle fixe : le thème s'adapte lui-même à la résolution (référence 1920×1080)
GreeterEnvironment=QT_SCREEN_SCALE_FACTORS=1,QT_FONT_DPI=96
# Pas de clavier virtuel (qtvirtualkeyboard) ; Verr. Num. activé au démarrage
InputMethod=
Numlock=on
