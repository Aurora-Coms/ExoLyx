# Disposition AZERTY (fr) par défaut pour l'écran de connexion (serveur X de SDDM).
# Nom choisi pour être lu AVANT 00-keyboard.conf : si `localectl set-x11-keymap`
# a écrit une autre disposition, c'est elle qui l'emporte.
Section "InputClass"
        Identifier "exolyx-clavier"
        MatchIsKeyboard "on"
        Option "XkbLayout" "fr"
EndSection
