// ExoLyx : la première ligne d'un fichier AutoConfig est toujours ignorée.
// Style « Ardoise » de l'interface de Firefox, sauf si l'utilisateur a choisi « D'origine »
// dans Configuration du système > Applications > Style des applications
// (fichier témoin ~/.config/exolyx/firefox-origine).
try {
  const Cc = Components.classes, Ci = Components.interfaces;
  const dossier = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties).get("Home", Ci.nsIFile);
  const temoin = dossier.clone();
  [".config", "exolyx", "firefox-origine"].forEach(p => temoin.append(p));
  if (!temoin.exists()) {
    defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
    defaultPref("browser.compactmode.show", true);
    defaultPref("browser.uidensity", 1);
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
    const ios = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
    const uri = ios.newURI("file:///usr/share/exolyx/firefox/ardoise.css");
    if (!sss.sheetRegistered(uri, sss.USER_SHEET)) sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  } else {
    defaultPref("extensions.activeThemeID", "default-theme@mozilla.org");
    defaultPref("browser.uidensity", 0);
  }
} catch (e) {
  Components.utils.reportError("ExoLyx : style Ardoise non appliqué : " + e);
}
