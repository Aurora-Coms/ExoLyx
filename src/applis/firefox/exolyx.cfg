// ExoLyx : la première ligne d'un fichier AutoConfig est toujours ignorée.
// Applique la feuille de style « Ardoise » à l'interface de Firefox (pas aux pages web).
try {
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Components.interfaces.nsIStyleSheetService);
  const ios = Components.classes["@mozilla.org/network/io-service;1"]
    .getService(Components.interfaces.nsIIOService);
  const uri = ios.newURI("file:///usr/share/exolyx/firefox/ardoise.css");
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {
  Components.utils.reportError("ExoLyx : style Ardoise non appliqué : " + e);
}
