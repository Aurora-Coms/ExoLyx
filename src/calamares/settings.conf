# Configuration principale de Calamares 3.3 pour ExoLyx.
# Installée dans /etc/calamares/settings.conf (paquet exolyx-calamares-config).
---
modules-search: [ local, /usr/lib/calamares/modules ]

# Instances supplémentaires : chaque instance lit son propre fichier
# /etc/calamares/modules/<config>.
instances:
  - id: nettoyage
    module: shellprocess
    config: shellprocess-nettoyage.conf
  - id: finalisation
    module: shellprocess
    config: shellprocess-finalisation.conf
  - id: initramfs
    module: shellprocess
    config: shellprocess-initramfs.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      # Nettoyage du live AVANT « users » : l'utilisateur live « exolyx »
      # doit disparaître avant la création du compte choisi (qui peut
      # porter le même nom).
      - shellprocess@nettoyage
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      # Finalisation AVANT grubcfg/bootloader : elle modifie /etc/default/grub
      # (thème, ligne de commande, sous-menu grub-btrfs).
      - shellprocess@finalisation
      - initcpiocfg
      # Garantit les hooks plymouth / grub-btrfs-overlayfs dans le
      # mkinitcpio.conf écrit par initcpiocfg, avant la génération.
      - shellprocess@initramfs
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: exolyx
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
