# Fuseau horaire et langue du système installé.
---
# Fuseau par défaut : Europe/Paris.
region: "Europe"
zone: "Paris"

# Ne pas modifier le fuseau du système live quand l'utilisateur clique sur la carte.
adjustLiveTimezone: false

localeGenPath: "/etc/locale.gen"

# Géolocalisation désactivée : on garde Europe/Paris (aucune requête réseau).
# Pour la réactiver, en HTTPS uniquement :
# geoip:
#     style: "json"
#     url: "https://geoip.kde.org/v1/calamares"
#     selector: ""
