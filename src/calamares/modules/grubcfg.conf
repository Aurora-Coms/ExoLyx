# Écriture de /etc/default/grub. On conserve le fichier existant
# (overwrite: false) : shellprocess@finalisation y a déjà réglé le thème
# et le sous-menu des instantanés.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
# Plymouth : « quiet splash ».
kernel_params: [ "quiet", "splash" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: false
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_DISABLE_RECOVERY: true
