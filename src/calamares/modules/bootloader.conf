# SPDX-License-Identifier: GPL-3.0-or-later
# Chargeur de démarrage : GRUB, en UEFI comme en BIOS.
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Nom de l'entrée NVRAM et du dossier /boot/efi/EFI/ExoLyx.
efiBootloaderId: "ExoLyx"
# Copie aussi EFI/BOOT/BOOTX64.EFI (firmwares capricieux, VirtualBox).
installEFIFallback: true
