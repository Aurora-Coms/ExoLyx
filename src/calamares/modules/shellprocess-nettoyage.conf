# shellprocess@nettoyage : retire de la cible tout ce qui est propre au live.
# Exécuté dans le chroot de la cible, juste après unpackfs.
# Un « - » en tête de commande signifie « l'échec n'arrête pas l'installation ».
---
dontChroot: false
timeout: 900
verbose: true
script:
    - command: "/bin/bash /usr/lib/exolyx/calamares/nettoyage.sh"
      timeout: 900
i18n:
    name: "Nettoyage du système live"
