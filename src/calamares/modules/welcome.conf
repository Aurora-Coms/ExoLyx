# Écran d'accueil et vérification des prérequis.
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    # Espace disque minimal, en Gio.
    requiredStorage: 20
    # Mémoire vive minimale, en Gio.
    requiredRam: 2.0
    # Calamares 3.3 accepte une liste d'URL ; la première qui répond suffit.
    internetCheckUrl:
        - https://archlinux.org
        - https://github.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
    # Bloquants : uniquement espace, RAM et droits root.
    # « power » et « internet » ne sont que des recommandations.
    required:
        - storage
        - ram
        - root

# Pas de géolocalisation pour la langue : ExoLyx démarre en français.
# geoip:
#     style: "none"
