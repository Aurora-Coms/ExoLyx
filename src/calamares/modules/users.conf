# Création du compte utilisateur.
---
defaultGroups:
    - name: wheel
      must_exist: false
      system: true
    - name: audio
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: storage
      must_exist: false
      system: true
    - name: network
      must_exist: false
      system: true
    - name: lp
      must_exist: false
      system: true
    - name: sys
      must_exist: false
      system: true

autologinGroup: autologin
doAutologin: false

# sudo via le groupe wheel (écrit /etc/sudoers.d/10-installer).
sudoersGroup: wheel
sudoersConfigureWithGroup: false

setRootPassword: true
doReusePassword: true

# Mot de passe : pas trop contraignant.
passwordRequirements:
    nonempty: true
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

userShell: /bin/bash

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-exolyx"
    forbidden_names: [ localhost ]
