# Génération de /etc/fstab et /etc/crypttab.
# Rappel Calamares 3.3 : les options Btrfs (compress=zstd:1, noatime) et SSD
# (discard=async) sont définies dans mount.conf, que fstab réutilise.
---
crypttabOptions: luks

# /tmp en tmpfs sur SSD comme sur disque classique (systemd le fait déjà ;
# on laisse donc fstab ne rien écrire pour /tmp).
tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: false
        options: ""
