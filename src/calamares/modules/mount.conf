# Montage de la cible, sous-volumes Btrfs et options de montage.
# Calamares 3.3 : les options de montage (y compris SSD) sont ici et non
# plus dans fstab.conf ; « options » est une liste.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # Support de l'ISO, rendu visible dans le chroot : shellprocess@nettoyage
    # y lit le noyau (/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux).
    - device: /run/archiso/bootmnt
      mountPoint: /run/archiso/bootmnt
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# Sous-volumes Btrfs (créés uniquement si la racine est en Btrfs).
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /.snapshots
      subvolume: /@snapshots

# Sous-volume du fichier d'échange (si l'utilisateur choisit « fichier »).
btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
    - filesystem: ext4
      options: [ defaults, noatime ]
    - filesystem: xfs
      options: [ defaults, noatime ]
