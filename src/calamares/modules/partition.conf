# SPDX-License-Identifier: GPL-3.0-or-later
# Partitionnement : Btrfs par défaut, pas de partition d'échange (zram).
---
# Partition système EFI (format Calamares 3.3).
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

# Clés historiques (≤ 3.2), conservées en commentaire au cas où :
# efiSystemPartition: "/boot/efi"
# efiSystemPartitionSize: 512M
# efiSystemPartitionName: "EFI"

# Échange : aucun par défaut (zram-generator), fichier d'échange en option.
userSwapChoices:
    - none
    - file
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase

defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]

# Chiffrement proposé dans le mode automatique.
enableLuksAutomatedPartitioning: true
# GRUB ne sait ouvrir que LUKS1 de manière fiable (/boot est chiffré avec /).
luksGeneration: luks1
showNotEncryptedBootMessage: true
