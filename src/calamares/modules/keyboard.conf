# Clavier. La disposition par défaut est devinée à partir de la langue
# et de la disposition active du live (fr, AZERTY).
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
# Spécifique à Debian (/etc/default/keyboard) : inutile sur Arch.
writeEtcDefaultKeyboard: false
