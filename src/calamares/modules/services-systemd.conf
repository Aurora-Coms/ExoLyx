# Services activés sur le système installé (format « units » de Calamares 3.3).
# mandatory: false => un service absent ne bloque pas l'installation.
---
units:
    - name: NetworkManager.service
      action: enable
      mandatory: true
    - name: sddm.service
      action: enable
      mandatory: true
    - name: bluetooth.service
      action: enable
      mandatory: false
    - name: ufw.service
      action: enable
      mandatory: false
    - name: systemd-timesyncd.service
      action: enable
      mandatory: false
    - name: fstrim.timer
      action: enable
      mandatory: false
    - name: snapper-timeline.timer
      action: enable
      mandatory: false
    - name: snapper-cleanup.timer
      action: enable
      mandatory: false
    - name: grub-btrfsd.service
      action: enable
      mandatory: false
    # Impression : optionnel (seulement si cups est présent sur l'ISO).
    - name: cups.socket
      action: enable
      mandatory: false
