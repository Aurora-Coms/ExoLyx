# shellprocess@finalisation : snapper, pare-feu, Plymouth, GRUB, trousseau pacman.
# Exécuté dans le chroot, AVANT grubcfg/bootloader (modifie /etc/default/grub).
# La désinstallation de Calamares est la dernière commande : le script
# finalisation.sh appartient au paquet retiré.
---
dontChroot: false
timeout: 1800
verbose: true
script:
    - command: "/bin/bash /usr/lib/exolyx/calamares/finalisation.sh"
      timeout: 1800
    # SNAP_PAC_SKIP : pas d'instantané snap-pac pour cette transaction.
    - command: "-env SNAP_PAC_SKIP=y pacman -Rns --noconfirm calamares exolyx-calamares-config"
      timeout: 600
i18n:
    name: "Finalisation d'ExoLyx"
