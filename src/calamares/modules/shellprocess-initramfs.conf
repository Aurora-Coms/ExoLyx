# shellprocess@initramfs : entre initcpiocfg et initcpio. Ajoute aux HOOKS
# de /etc/mkinitcpio.conf « plymouth » (après udev/systemd) et
# « grub-btrfs-overlayfs » (en dernier, démarrage sur instantané en lecture
# seule) s'ils manquent. Script inline : le paquet de configuration
# a déjà été retiré à ce stade.
---
dontChroot: false
timeout: 120
verbose: true
script:
    - command: "-sh -c 'grep -Eq \"^HOOKS=.*\\bplymouth\\b\" /etc/mkinitcpio.conf || sed -i -E \"/^HOOKS=/ s/\\b(udev|systemd)\\b/\\1 plymouth/\" /etc/mkinitcpio.conf'"
    - command: "-sh -c '[ -e /usr/lib/initcpio/install/grub-btrfs-overlayfs ] && { grep -Eq \"^HOOKS=.*grub-btrfs-overlayfs\" /etc/mkinitcpio.conf || sed -i -E \"/^HOOKS=/ s/\\)\\s*$/ grub-btrfs-overlayfs)/\" /etc/mkinitcpio.conf; } || true'"
    - command: "-sh -c 'grep -E \"^HOOKS=\" /etc/mkinitcpio.conf'"
i18n:
    name: "Préparation de l'initramfs"
