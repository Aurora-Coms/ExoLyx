<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="planete" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#E4F5B8"/>
      <stop offset="0.28" stop-color="#BDD479"/>
      <stop offset="0.62" stop-color="#6FA845"/>
      <stop offset="1" stop-color="#1F3A1F"/>
    </radialGradient>
    <linearGradient id="orbiteA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BDD479"/>
      <stop offset="1" stop-color="#8DD479"/>
    </linearGradient>
    <linearGradient id="orbiteB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8D479"/>
      <stop offset="1" stop-color="#E4F5B8"/>
    </linearGradient>
    <clipPath id="dessus"><rect x="0" y="0" width="256" height="128"/></clipPath>
    <clipPath id="dessous"><rect x="0" y="128" width="256" height="128"/></clipPath>
  </defs>
  <!-- orbites, moitié arrière (passent derrière la planète) -->
  <g fill="none" stroke-linecap="round" clip-path="url(#dessus)">
    <ellipse cx="128" cy="128" rx="112" ry="38" transform="rotate(-24 128 128)" stroke="url(#orbiteA)" stroke-width="9" opacity="0.55"/>
    <ellipse cx="128" cy="128" rx="112" ry="38" transform="rotate(24 128 128)" stroke="url(#orbiteB)" stroke-width="9" opacity="0.55"/>
  </g>
  <!-- planète en relief -->
  <circle cx="128" cy="128" r="66" fill="url(#planete)"/>
  <path d="M84 104 A50 50 0 0 1 150 72" fill="none" stroke="#F4FBE2" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <!-- orbites, moitié avant, tressées : l'une passe sur l'autre -->
  <g fill="none" stroke-linecap="round" clip-path="url(#dessous)">
    <ellipse cx="128" cy="128" rx="112" ry="38" transform="rotate(24 128 128)" stroke="#0D1310" stroke-width="15"/>
    <ellipse cx="128" cy="128" rx="112" ry="38" transform="rotate(24 128 128)" stroke="url(#orbiteB)" stroke-width="9"/>
    <ellipse cx="128" cy="128" rx="112" ry="38" transform="rotate(-24 128 128)" stroke="#0D1310" stroke-width="15"/>
    <ellipse cx="128" cy="128" rx="112" ry="38" transform="rotate(-24 128 128)" stroke="url(#orbiteA)" stroke-width="9"/>
  </g>
  <circle cx="226" cy="84" r="9" fill="#E4F5B8"/>
</svg>
