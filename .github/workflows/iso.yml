name: Construire l'ISO ExoLyx

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'vm/**', 'docs/**']
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Construire paquets et ISO (conteneur Arch)
        run: |
          sudo docker run --rm --privileged \
            -v "$PWD:/exolyx" \
            -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            archlinux:latest bash /exolyx/scripts/ci.sh

      - name: Publier l'ISO (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: exolyx-iso
          path: |
            sortie/*.iso
            sortie/SHA256SUMS
          compression-level: 0
          retention-days: 14

      - name: Publier le dépôt pacman (release « depot »)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le dossier depot/ appartient à root (conteneur) : on publie une copie.
          # cp -L remplace les liens symboliques exolyx.db/.files par de vrais fichiers.
          mkdir -p publication
          cp -L depot/* publication/
          cd publication
          gh release view depot >/dev/null 2>&1 || \
            gh release create depot --title "Dépôt pacman ExoLyx" \
              --notes "Paquets ExoLyx pour pacman. Ne pas télécharger à la main : utilisé par les mises à jour du système."
          gh release upload depot exolyx.db exolyx.files exolyx.db.tar.gz exolyx.files.tar.gz *.pkg.tar.zst --clobber
